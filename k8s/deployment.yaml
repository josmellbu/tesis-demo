apiVersion: apps/v1
kind: Deployment
metadata:
  name: tesis-demo
  labels:
    app: tesis-demo
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: tesis-demo
  template:
    metadata:
      labels:
        app: tesis-demo
      # Agregar annotations para forzar update
      annotations:
        rollout-timestamp: "${ROLLOUT_TIMESTAMP}"
    spec:
      containers:
      - name: tesis-demo
        image: ${DOCKERHUB_USER}/tesis-demo:${IMAGE_TAG}
        # CLAVE: Siempre hacer pull de la imagen
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: MONGO_HOST
          value: mongo-service.default.svc.cluster.local
        - name: MONGO_PORT
          value: "27017"
        - name: MONGO_DB
          value: billingapp_db
        - name: MONGO_USER
          valueFrom:
            secretKeyRef:
              name: mongo-secret
              key: mongo-root-username
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongo-secret
              key: mongo-root-password
        # Agregar readiness y liveness probes
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        # Configurar recursos
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"