apiVersion: apps/v1
kind: Deployment
metadata:
  name: tesis-demo
  labels:
    app: tesis-demo
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: tesis-demo
  template:
    metadata:
      labels:
        app: tesis-demo
      annotations:
        # Force pod restart on every deployment
        deployment.kubernetes.io/revision: "${IMAGE_TAG}"
    spec:
      containers:
      - name: tesis-demo
        image: ${DOCKERHUB_USER}/tesis-demo:${IMAGE_TAG}
        imagePullPolicy: Always  # CRITICAL: Always pull latest image
        ports:
        - containerPort: 8080
        env:
        - name: MONGO_HOST
          value: mongo-service.default.svc.cluster.local
        - name: MONGO_PORT
          value: "27017"
        - name: MONGO_DB
          value: billingapp_db
        - name: MONGO_USER
          valueFrom:
            secretKeyRef:
              name: mongo-secret
              key: mongo-root-username
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongo-secret
              key: mongo-root-password
        - name: APP_USER
          value: "admin"
        
        # Health checks - FIXED to use correct actuator endpoints
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 90  # Increased to allow app startup
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
          
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60  # Increased to allow app startup
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
          
        # Startup probe - for slow starting applications
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12  # Allow up to 2 minutes for startup
          
        # Resource limits (optional but recommended)
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"