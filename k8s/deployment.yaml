apiVersion: apps/v1
kind: Deployment
metadata:
  name: tesis-demo
  labels:
    app: tesis-demo
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: tesis-demo
  template:
    metadata:
      labels:
        app: tesis-demo
      annotations:
        deployment.kubernetes.io/revision: "${IMAGE_TAG}"
    spec:
      containers:
      - name: tesis-demo
        image: ${DOCKERHUB_USER}/tesis-demo:${IMAGE_TAG}
        imagePullPolicy: Always  # CRITICAL: Always pull latest image
        ports:
        - containerPort: 8080
        env:
        - name: MONGO_HOST
          value: mongo-service.default.svc.cluster.local
        - name: MONGO_PORT
          value: "27017"
        - name: MONGO_DB
          value: billingapp_db
        - name: MONGO_USER
          valueFrom:
            secretKeyRef:
              name: mongo-secret
              key: mongo-root-username
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongo-secret
              key: mongo-root-password
        # Health checks
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10