apiVersion: v1
kind: Service
metadata:
  name: tesis-demo
  labels:
    app: tesis-demo
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/actuator/prometheus"
    prometheus.io/port: "8080"
spec:
  type: ClusterIP
  selector:
    app: tesis-demo
  ports:
  - name: http
    port: 80
    targetPort: 8080