# application-test.properties
# Test database configuration
spring.data.mongodb.database=billingapp_test_db
spring.data.mongodb.uri=mongodb://localhost:27017/billingapp_test_db

# Disable security for easier testing
spring.security.user.name=test
spring.security.user.password=test
spring.security.user.roles=ADMIN

# Disable unnecessary features for testing
spring.jpa.hibernate.ddl-auto=create-drop
logging.level.org.springframework.web=DEBUG
logging.level.com.example.billing=DEBUG

# Test pagination settings
spring.data.web.pageable.default-page-size=5
spring.data.web.pageable.max-page-size=20

# Swagger disabled in tests
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false