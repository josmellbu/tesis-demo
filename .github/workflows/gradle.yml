name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci:

    runs-on: ubuntu-latest
    # permissions:
    #   contents: read
    #   id-token: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582

      - name: Set execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle Wrapper
        run: ./gradlew test

      - name: Generate semantic version
        id: semver
        run: |
          latest_tag=$(git describe --tags --abbrev=0 || echo "0.0.0")
          echo "Último tag: $latest_tag"

          IFS='.' read -r major minor patch <<<"${latest_tag//v/}"

          patch=$((patch + 1))
          new_version="v$major.$minor.$patch"
  
          echo "Nuevo tag: $new_version"

          echo "new_version=$new_version" >> $GITHUB_ENV

      - name: docker build 
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/tesis-demo:${{ env.new_version }} .

      - name: Docker Login
        uses: docker/login-action@v3.3.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: docker push 
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/tesis-demo:${{ steps.image.outputs.tag }}
      
    outputs:
        image_tag: ${{ steps.image.outputs.tag }}

