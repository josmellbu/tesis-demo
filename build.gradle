plugins {
    id 'java'
    id 'org.springframework.boot' version '3.0.5'
    id 'io.spring.dependency-management' version '1.1.0'
    id 'jacoco' // Plugin para cobertura de código
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    
    // MapStruct
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'de.flapdoodle.embed:de.flapdoodle.embed.mongo'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mongodb'
}

// Configuración de JaCoCo
jacoco {
    toolVersion = "0.8.8"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    finalizedBy jacocoTestCoverageVerification
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.70 // 70% cobertura mínima
            }
        }
    }
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
    
    // Generar reporte detallado de tests
    testLogging {
        events "passed", "skipped", "failed", "standardOut", "standardError"
        exceptionFormat "full"
        showExceptions true
        showCauses true
        showStackTraces true
    }
    
    // Configuración para métricas de performance
    systemProperty 'spring.profiles.active', 'test'
}

// Task personalizada para métricas
tasks.register('generateMetrics') {
    dependsOn test, jacocoTestReport
    doLast {
        def testResultsDir = file("$buildDir/test-results/test")
        def jacocoReportFile = file("$buildDir/reports/jacoco/test/jacocoTestReport.xml")
        
        // Crear reporte de métricas
        def metricsFile = file("$buildDir/metrics.json")
        def metrics = [:]
        
        if (testResultsDir.exists()) {
            def testFiles = testResultsDir.listFiles().findAll { it.name.startsWith("TEST-") && it.name.endsWith(".xml") }
            def totalTests = 0
            def failedTests = 0
            def skippedTests = 0
            
            testFiles.each { testFile ->
                def xml = new XmlSlurper().parse(testFile)
                totalTests += xml.@tests.toInteger()
                failedTests += xml.@failures.toInteger()
                skippedTests += xml.@skipped.toInteger()
            }
            
            metrics.tests = [
                total: totalTests,
                failed: failedTests,
                skipped: skippedTests,
                passed: totalTests - failedTests - skippedTests
            ]
        }
        
        if (jacocoReportFile.exists()) {
            def xml = new XmlSlurper().parse(jacocoReportFile)
            def instruction = xml.counter.find { it.@type == 'INSTRUCTION' }
            if (instruction) {
                def covered = instruction.@covered.toInteger()
                def missed = instruction.@missed.toInteger()
                def total = covered + missed
                metrics.coverage = [
                    covered: covered,
                    missed: missed,
                    total: total,
                    percentage: total > 0 ? (covered * 100.0 / total).round(2) : 0
                ]
            }
        }
        
        metricsFile.text = groovy.json.JsonBuilder(metrics).toPrettyString()
        println "Métricas generadas en: $metricsFile"
    }
}